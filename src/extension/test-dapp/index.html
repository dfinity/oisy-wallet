<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OISY extension test dapp</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--surface: #f4f4f7;
				--text: #14141a;
				--muted: #6b6b78;
				--ok: #1a7f43;
				--bad: #c0262d;
				--accent: #3b00b9;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #15151c;
					--surface: #1f1f29;
					--text: #f2f2f6;
					--muted: #9a9aa8;
					--ok: #4ad37f;
					--bad: #ff6b70;
					--accent: #8f6bff;
				}
			}
			body {
				max-width: 880px;
				margin: 0 auto;
				padding: 24px 16px 48px;
				background: var(--bg);
				color: var(--text);
				font:
					15px/1.5 system-ui,
					sans-serif;
			}
			h1 {
				font-size: 22px;
				margin: 0 0 4px;
			}
			h2 {
				font-size: 17px;
				margin: 0 0 12px;
			}
			.muted {
				color: var(--muted);
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
				gap: 16px;
				margin: 24px 0;
			}
			section {
				padding: 16px;
				border-radius: 12px;
				background: var(--surface);
			}
			button {
				display: block;
				width: 100%;
				margin-top: 8px;
				padding: 9px 12px;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: #fff;
				font: inherit;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.4;
				cursor: default;
			}
			ul {
				margin: 0;
				padding-left: 18px;
			}
			#log {
				list-style: none;
				padding: 0;
				font-family: ui-monospace, monospace;
				font-size: 13px;
			}
			#log li {
				padding: 8px 0;
				border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent);
				overflow-wrap: anywhere;
			}
			.ok {
				color: var(--ok);
			}
			.bad {
				color: var(--bad);
			}
		</style>
	</head>
	<body>
		<h1>OISY extension test dapp</h1>
		<p class="muted">
			Sepolia and Solana devnet only. Finds wallets through EIP-6963 and the Wallet Standard, like
			wagmi and the Solana wallet adapter do.
		</p>

		<div class="grid">
			<section>
				<h2>Wallets found</h2>
				<ul id="wallets">
					<li class="muted">None yet</li>
				</ul>
			</section>

			<section>
				<h2>Ethereum · Sepolia</h2>
				<p class="muted" id="eth-account">Not connected</p>
				<button id="eth-accounts" type="button">eth_accounts</button>
				<button id="eth-connect" type="button">Connect</button>
				<button id="eth-sign" type="button">Sign a message</button>
				<button id="eth-typed" type="button">Sign typed data</button>
				<button id="eth-send" type="button">Send 0 ETH to myself</button>
				<button id="eth-switch" type="button">Switch to mainnet (should fail)</button>
			</section>

			<section>
				<h2>Solana · devnet</h2>
				<p class="muted" id="sol-account">Not connected</p>
				<button id="sol-connect" type="button">Connect</button>
				<button id="sol-sign" type="button">Sign a message</button>
				<button id="sol-sign-tx" type="button">Sign a transaction</button>
				<button id="sol-send-tx" type="button">Sign and send a transaction</button>
			</section>
		</div>

		<section>
			<h2>Results</h2>
			<ul id="log"></ul>
		</section>

		<script type="module" src="/test-dapp.js"></script>
	</body>
</html>
