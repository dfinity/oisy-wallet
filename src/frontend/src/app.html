<!doctype html>
<html lang="en">
	<head>
		<!-- Init theme as fast as possible -->
		<script theme-loader>
			try {
				const isDarkPreferred = window.matchMedia('(prefers-color-scheme: dark)').matches;

				const currentTheme =
					localStorage.nnsTheme === null ||
					localStorage.nnsTheme === undefined ||
					localStorage.nnsTheme === ''
						? undefined
						: JSON.parse(localStorage.nnsTheme);

				document.documentElement.setAttribute(
					'theme',
					currentTheme ?? (isDarkPreferred ? 'dark' : 'light')
				);
			} catch (error) {
				console.error('Error initializing theme', error);
			}
		</script>

		<!-- Init language as fast as possible -->
		<script language-loader>
			try {
				const currentLanguage =
					localStorage.lang === null || localStorage.lang === undefined || localStorage.lang === ''
						? undefined
						: JSON.parse(localStorage.lang);

				document.documentElement.setAttribute('lang', currentLanguage ?? 'en');
			} catch (error) {
				console.error('Error initializing language', error);
			}
		</script>

		<style>
			:root {
				&,
				#app-background-container {
					background: #e8f1ff;
				}
				color: #000;
			}
			:root[theme='dark'] {
				&,
				#app-background-container {
					background: #070f1c;
				}
				color: #f4f6fa;
			}
		</style>

		<!-- CONTENT_SECURITY_POLICY -->

		<meta charset="utf-8" />
		<!-- Keep font preloads multiline: the legacy script-preload regex in
		     scripts/build.csp.mjs must not reinterpret them as script preloads. -->
		<link
			rel="preload"
			href="/fonts/CircularXXWeb-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/fonts/CircularXXWeb-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />

		<title>{{OISY_NAME}}</title>
		<link href="https://oisy.com" rel="canonical" />
		<meta content="{{OISY_DESCRIPTION}}" name="description" />
		<meta content="{{OISY_NAME}}" property="og:title" />
		<meta content="{{OISY_DESCRIPTION}}" property="og:description" />
		<meta content="website" property="og:type" />
		<meta content="https://oisy.com" property="og:url" />
		<meta content="https://oisy.com/images/share-image.webp" property="og:image" />
		<meta content="summary_large_image" name="twitter:card" />
		<meta content="{{OISY_NAME}}" name="twitter:title" />
		<meta content="{{OISY_DESCRIPTION}}" name="twitter:description" />
		<meta content="https://oisy.com/images/share-image.webp" name="twitter:image" />
		<meta content="@dfinity" name="twitter:creator" />

		<link crossorigin="anonymous" href="/manifest.webmanifest" rel="manifest" />

		<!-- Favicon -->
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicons/favicon-16x16.png"
		/>
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />

		<!-- iOS meta tags & icons -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="#016DFC" />
		<meta name="apple-mobile-web-app-title" content="{{OISY_NAME}}" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicons/apple-touch-icon.png" />
		<link
			rel="mask-icon"
			href="%sveltekit.assets%/favicons/safari-pinned-tab.svg"
			color="#016DFC"
		/>

		<!-- MS -->
		<meta name="msapplication-TileColor" content="#016DFC" />
		<meta name="msapplication-config" content="%sveltekit.assets%/favicons/browserconfig.xml" />

		<meta content="#FFFFFF" name="theme-color" />
		%sveltekit.head%
		<!-- ROUTE_STYLE -->

		<style>
			#app-spinner {
				--spinner-size: 48px;

				color: var(--color-foreground-brand-primary, #0066ff);
				width: var(--spinner-size);
				height: var(--spinner-size);
				position: fixed;
				top: 50%;
				left: 50%;
				margin-left: calc(var(--spinner-size) / -2);
				margin-top: calc(var(--spinner-size) / -2);
				pointer-events: none;
			}

			:root[theme='dark'] #app-spinner {
				color: var(--color-foreground-primary, #f4f6fa);
			}

			#app-spinner svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			#app-spinner .trace {
				/* Preserve the startup loader's existing 30-second animation cap. */
				animation: app-spinner-trace 1200ms linear 25;
				animation-play-state: var(--spinner-play-state, running);
			}

			@keyframes app-spinner-trace {
				to {
					stroke-dashoffset: -100;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#app-spinner .trace {
					animation: none;
					stroke-dasharray: none;
				}
			}

			#app-background-container {
				contain: paint;
				pointer-events: none;

				position: fixed;
				top: 0;
				left: 50%;

				transform: translateX(-50%);

				display: flex;
				justify-content: center;

				width: 100%;
				height: 100%;

				z-index: -1;

				overflow: hidden;
			}

			#app-background-light,
			#app-background-dark,
			#app-background-landing-light,
			#app-background-landing-dark {
				contain: paint;
				pointer-events: none;

				width: 100%;
				height: 100%;
				min-width: 1728px;

				object-fit: cover;
			}

			/* Default background: landing page artwork (shown pre-hydration and on the signed-out landing screen). */
			#app-background-light,
			#app-background-dark,
			#app-background-landing-light,
			#app-background-landing-dark {
				display: none;
			}

			:root[theme='light'] #app-background-landing-light {
				display: block;
			}

			:root[theme='dark'] #app-background-landing-dark {
				display: block;
			}

			/* In-app views (signed-in routes, lock page) opt out via [data-app-view] and fall back to the classic OISY background. */
			:root[theme='light'] body:has([data-app-view]) #app-background-landing-light,
			:root[theme='dark'] body:has([data-app-view]) #app-background-landing-dark {
				display: none;
			}

			:root[theme='light'] body:has([data-app-view]) #app-background-light {
				display: block;
			}

			:root[theme='dark'] body:has([data-app-view]) #app-background-dark {
				display: block;
			}
		</style>

		<!-- LINKS_PRELOADER -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-background-container">
			<img
				id="app-background-light"
				src="/images/oisy_bg_light.webp"
				alt="OISY Background light theme"
				decoding="sync"
			/>
			<img
				id="app-background-dark"
				src="/images/oisy_bg_dark.webp"
				alt="OISY Background dark theme"
				decoding="sync"
			/>
			<img
				id="app-background-landing-light"
				src="/images/landing_bg_light.webp"
				alt="OISY Background light theme"
				fetchpriority="high"
				decoding="sync"
			/>
			<img
				id="app-background-landing-dark"
				src="/images/landing_bg_dark.webp"
				alt="OISY Background dark theme"
				fetchpriority="high"
				decoding="sync"
			/>
		</div>

		<div style="display: contents">%sveltekit.body%</div>

		<!-- All resources required to boot the dapp can take some times to be downloaded on the IC. -->
		<!-- That's why we are displaying a spinner while the dapp is starting. -->
		<!-- Spinner which is then removed as soon as the authentication is initialized (regardless if sign-in or sign-out) -->
		<div id="app-spinner" aria-hidden="true" data-tid="spinner">
			<!-- Keep this pre-hydration visor in sync with ui/Spinner.svelte. -->
			<svg
				viewBox="0 0 46 40"
				fill="none"
				stroke="currentColor"
				stroke-width="3.2"
				stroke-linejoin="round"
				focusable="false"
			>
				<path
					d="M41.9679 20.9668V19.3807C42.1127 8.8544 33.3268 6.93179 22.996 6.7876C12.617 6.93179 3.83106 8.8544 3.97589 19.3807V20.9668C3.83106 31.5412 12.617 33.4638 22.996 33.608C33.3268 33.4638 42.1127 31.5412 41.9679 20.9668Z"
					pathLength="100"
					opacity="0.2"
				/>
				<path
					class="trace"
					d="M41.9679 20.9668V19.3807C42.1127 8.8544 33.3268 6.93179 22.996 6.7876C12.617 6.93179 3.83106 8.8544 3.97589 19.3807V20.9668C3.83106 31.5412 12.617 33.4638 22.996 33.608C33.3268 33.4638 42.1127 31.5412 41.9679 20.9668Z"
					pathLength="100"
					stroke-dasharray="25 75"
					stroke-linecap="round"
				/>
			</svg>
		</div>

		<!-- SCRIPT_LOADER -->
	</body>
</html>
