name: CallbackProbe
options:
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 7FY8G6QYKD
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: org.dfinity.oisy.callbackcheck.artem
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Callback Check
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CallbackProbe:
    type: application
    platform: iOS
    sources: [CallbackProbe.swift]
schemes:
  CallbackProbe:
    build:
      targets: { CallbackProbe: all }
