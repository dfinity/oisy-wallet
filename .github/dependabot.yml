# Please see the documentation for all configuration options:
# https://docs.github.com/en/enterprise-cloud@latest/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(github-actions): '
    cooldown:
      default-days: 30

  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(cargo-deps): '
      prefix-development: 'chore(cargo-deps-dev): '
    cooldown:
      default-days: 30

  - package-ecosystem: rust-toolchain
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(rust): '
    cooldown:
      default-days: 30

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(npm-deps): '
      prefix-development: 'chore(npm-deps-dev): '
    cooldown:
      default-days: 30
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: '@dfinity/*'
      - dependency-name: '@icp-sdk/*'
      - dependency-name: '@types/*'
      - dependency-name: 'typescript'
      # Majors of the vite-group and vitest-group need a dedicated migration, not a grouped
      # bump: Vite 8 was reverted (#13296: Rolldown OOMs in the emulated reproducible Docker
      # build) and pulls in SvelteKit 3 / adapter-static 4, and Vitest 5 breaks the
      # @testing-library/jest-dom matcher types (testing-library/jest-dom#738).
      # Minor and patch updates still come through.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/adapter-static'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
    groups:
      solana-kit:
        patterns:
          - '@solana-program/address-lookup-table'
          - '@solana-program/compute-budget'
          - '@solana-program/memo'
          - '@solana-program/stake'
          - '@solana-program/system'
          - '@solana-program/token'
          - '@solana-program/token-2022'
          - '@solana/kit'
      vitest-group:
        patterns:
          - 'vitest'
          - 'vitest-mock-extended'
          - '@vitest/coverage-v8'
      vite-group:
        patterns:
          - 'vite'
          - '@sveltejs/vite-plugin-svelte'
          - '@sveltejs/kit'
          - '@sveltejs/adapter-static'
