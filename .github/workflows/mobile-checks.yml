name: Mobile Compatibility

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ios:
    name: iOS host and shared web
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RUSTUP_TOOLCHAIN: '1.99.0'
      DFX_NETWORK: audit
      VITE_MOBILE_SHELL: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare frontend
        uses: ./.github/actions/prepare
      - name: Check native build configuration and SDK provenance tests
        run: npm exec -- vitest run src/frontend/src/tests/mobile-
      - name: Build normal website without test authority
        env:
          VITE_MOBILE_UI_TEST: 'false'
        run: |
          npm exec -- vite build
          test -f build/index.html
          if grep -rlE 'oisyTestEmptyNotes|oisyTestNavigation|oisyTestTransaction|mobile-sdk-session\.fixture' build; then
            echo 'Test-only authority or fixtures entered the website bundle.' >&2
            exit 1
          fi
      - name: Build offline web fixtures from the same source
        env:
          OISY_MOBILE_SHELL: '1'
          VITE_MOBILE_UI_TEST: 'true'
        run: |
          npm exec -- vite build
          mkdir -p mobile/capacitor/ios/App/App/public
          rsync -a --delete build-mobile/ mobile/capacitor/ios/App/App/public/
      - name: Prepare pinned native SDK and Xcode project
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          brew install xcodegen
          node mobile/capacitor/prepare-native-sdk.mjs
          npm run mobile:sync:ios
      - name: Boot iPhone simulator
        id: simulator
        run: |
          device=$(xcrun simctl create 'OISY CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Test native host and real WebKit contracts
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild test \
            -project mobile/capacitor/ios/App/App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/oisy-ios" \
            -resultBundlePath "$RUNNER_TEMP/oisy-ios-tests.xcresult" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Verify offline fixtures stay outside the app
        run: |
          app="$RUNNER_TEMP/oisy-ios/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$app"
          test ! -e "$app/public"
          test -d "$app/PlugIns/AppTests.xctest/public"
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-compatibility-results
          path: ${{ runner.temp }}/oisy-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
