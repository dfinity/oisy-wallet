name: 'Install dfx'

description: >
  Installs dfx at the version in dfx.json, as dfinity/setup-dfx does, but retries the install
  script's download on any error.

runs:
  using: composite
  steps:
    # dfinity/setup-dfx fetches install.sh with `--retry` alone, which retries timeouts and 5xx
    # but not other HTTP errors. internetcomputer.org intermittently answers runners with a 400,
    # and each one failed the job outright. `--retry-all-errors` needs curl 7.71 or later, which
    # ubuntu-24.04 and macos-14 have; upstream left it out to support ubuntu-20.04.
    - name: Install dfx
      shell: bash
      env:
        DFXVM_INIT_YES: 'true'
      run: |
        DFX_VERSION="$(jq -er '.dfx // ""' dfx.json || echo "")"
        export DFX_VERSION
        echo "DFX_VERSION is $DFX_VERSION"

        # Before a retry, curl drops a cut-off download from an --output file, but it can't take
        # back what it already wrote to stdout, which would run a partial script and a full one.
        install_script="$(mktemp)"
        trap 'rm -f "$install_script"' EXIT
        curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 5 --max-time 20 --output "$install_script" https://internetcomputer.org/install.sh
        sh "$install_script"

    # zizmor flags every GITHUB_PATH write in a composite action, since it can't see which trigger
    # runs it. These add a fixed directory under $HOME, with no input from the event.
    - name: Set up path (linux)
      if: runner.os == 'Linux'
      shell: bash
      run: echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

    - name: Set up path (macos)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "$HOME/Library/Application Support/org.dfinity.dfx/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
